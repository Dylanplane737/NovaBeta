<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nova</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Pixelify+Sans&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <!-- Background atmosphere -->
    <div class="bg-blob bg-blob-1" aria-hidden="true"></div>
    <div class="bg-blob bg-blob-2" aria-hidden="true"></div>
    <div class="bg-blob bg-blob-3" aria-hidden="true"></div>
    <div class="bg-grid" aria-hidden="true"></div>

    <!-- Search Screen -->
    <div id="searchScreen">
        <div id="logo">Nova</div>
        <div id="searchContainer">
            <input type="text" id="urlInput" placeholder="Search anything..." autocomplete="off" aria-label="Search input">
            <div id="autocompleteDropdown" class="hidden" role="listbox"></div>
            <button id="searchBtn" aria-label="Search">Open!</button>
        </div>
        <div id="calculatorWidget" class="hidden">
            <div class="calc-box">
                <input type="text" id="calcInput" readonly aria-label="Calculator expression">
                <div id="calcResult" aria-live="polite"></div>
                <canvas id="graphCanvas" aria-label="Function graph"></canvas>
            </div>
        </div>
    </div>

    <!-- Dashboard -->
    <div id="dashboard" class="hidden">
        <div id="dashHeader">
            <span id="dashTitle"></span>
            <button id="backBtn" aria-label="Go back">Back</button>
        </div>
        <div id="dashContent">
            <div id="wikiWidget" class="widget"></div>
            <div id="rightCol">
                <div id="mediaWidget" class="widget"></div>
                <div id="videoWidget" class="widget"></div>
            </div>
            <div id="dictWidget" class="widget"></div>
            <div id="timelineWidget" class="widget"></div>
        </div>
    </div>

    <!-- Map -->
    <div id="mapWidget" class="hidden">
        <div id="mapHeader">
            <span id="mapTitle">Map</span>
            <button id="mapBackBtn" aria-label="Go back">Back</button>
        </div>
        <div id="mapBody">
            <div id="mapContainer"></div>
            <div id="mapResults"></div>
        </div>
    </div>

    <!-- Lightbox -->
    <div id="lightbox" class="hidden" role="dialog" aria-label="Image viewer">
        <button id="lightboxClose" aria-label="Close">&times;</button>
        <button id="lightboxPrev" aria-label="Previous image">&lt;</button>
        <img id="lightboxImg" src="" alt="Full size image">
        <button id="lightboxNext" aria-label="Next image">&gt;</button>
    </div>

    <!-- Matrix canvas for easter egg -->
    <canvas id="matrixCanvas" class="hidden" aria-hidden="true"></canvas>

    <!-- Easter egg image overlay -->
    <div id="easterEggImg" class="hidden" role="dialog" aria-label="Easter egg"></div>

    <!-- Loading spinner -->
    <div id="loadingSpinner" class="hidden" role="status" aria-label="Loading">
        <div class="spinner"></div>
    </div>

    <!-- App Dock -->
    <nav id="appDock" aria-label="Application dock">
        <div class="dock-icon" data-app="translate" title="Translate" tabindex="0" role="button" aria-label="Open Translate">
            <svg viewBox="0 0 24 24" width="28" height="28" fill="currentColor"><path d="M12.87 15.07l-2.54-2.51.03-.03A17.52 17.52 0 0014.07 6H17V4h-7V2H8v2H1v2h11.17C11.5 7.92 10.44 9.75 9 11.35 8.07 10.32 7.3 9.19 6.69 8h-2c.73 1.63 1.73 3.17 2.98 4.56l-5.09 5.02L4 19l5-5 3.11 3.11.76-2.04zM18.5 10h-2L12 22h2l1.12-3h4.75L21 22h2l-4.5-12zm-2.62 7l1.62-4.33L19.12 17h-3.24z"/></svg>
            <span>Translate</span>
        </div>
        <div class="dock-icon" data-app="settings" title="Settings" tabindex="0" role="button" aria-label="Open Settings">
            <svg viewBox="0 0 24 24" width="28" height="28" fill="currentColor"><path d="M19.14 12.94c.04-.3.06-.61.06-.94 0-.32-.02-.64-.07-.94l2.03-1.58a.49.49 0 00.12-.61l-1.92-3.32a.488.488 0 00-.59-.22l-2.39.96c-.5-.38-1.03-.7-1.62-.94l-.36-2.54a.484.484 0 00-.48-.41h-3.84c-.24 0-.43.17-.47.41l-.36 2.54c-.59.24-1.13.57-1.62.94l-2.39-.96c-.22-.08-.47 0-.59.22L2.74 8.87c-.12.21-.08.47.12.61l2.03 1.58c-.05.3-.07.62-.07.94s.02.64.07.94l-2.03 1.58a.49.49 0 00-.12.61l1.92 3.32c.12.22.37.29.59.22l2.39-.96c.5.38 1.03.7 1.62.94l.36 2.54c.05.24.24.41.48.41h3.84c.24 0 .44-.17.47-.41l.36-2.54c.59-.24 1.13-.56 1.62-.94l2.39.96c.22.08.47 0 .59-.22l1.92-3.32c.12-.22.07-.47-.12-.61l-2.01-1.58zM12 15.6A3.6 3.6 0 1115.6 12 3.611 3.611 0 0112 15.6z"/></svg>
            <span>Settings</span>
        </div>
    </nav>

    <!-- Floating windows container -->
    <div id="floatingWindows" aria-live="polite"></div>

    <script src="main.js"></script>
    <script src="modules/calculator.js"></script>
    <script src="modules/map.js"></script>
    <script src="modules/appsbar.js"></script>
    <script src="modules/apps/translate.js"></script>
    <script src="modules/apps/settings.js"></script>
</body>
</html>
